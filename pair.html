<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070707"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FOLKLET"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><title>Connect to FOLKLET</title><style>html{color-scheme:dark;background:#070707;color:#f2f2f2;font:16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}body{margin:0;min-height:100dvh;display:grid;place-items:center}main{width:min(330px,calc(100vw - 48px));padding:40px 0}img{width:76px;height:76px;border-radius:22px}h1{font-size:28px;font-weight:600;letter-spacing:-.8px;margin:22px 0 8px}p{font-size:14px;color:#999;margin:0 0 28px}label{display:block;font-size:13px;margin:18px 0 6px}input,button{box-sizing:border-box;width:100%;border-radius:12px;padding:13px 15px;font:inherit}input{border:1px solid #333;background:#171717;color:#eee}#code{font-size:24px;letter-spacing:6px}button{margin-top:25px;background:#eee;color:#111;border:0;font-weight:600}button:disabled{opacity:.6}small{display:block;color:#777;font-size:12px;margin-top:24px}#error{color:#ffa996;font-size:13px;margin-top:15px}a{color:inherit}</style></head><body><main><img src="/icons/crew-192.png" alt="FOLKLET"><h1>Your helpers, with you.</h1><p>Enter the code from <strong>My workspace → Connect iPhone</strong> in FOLKLET on your PC.</p><form id="pair"><label for="code">Pairing code</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" pattern="[0-9]{8}" required placeholder="00000000"><label for="name">Device name</label><input id="name" name="name" value="My iPhone" maxlength="60" autocomplete="off"><button id="connect">Connect to FOLKLET</button><div id="error" role="alert"></div></form><small>Once connected, use Safari’s Share menu → Add to Home Screen. Keep Tailscale connected and your PC awake.</small></main><script>document.getElementById('pair').onsubmit=async event=>{event.preventDefault();const button=document.getElementById('connect'),error=document.getElementById('error');button.disabled=true;error.textContent='';try{const r=await fetch('/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.getElementById('code').value,name:document.getElementById('name').value})});const data=await r.json();if(!r.ok)throw Error(data.error);location.replace('/');}catch(e){error.textContent=e.message;button.disabled=false;}};</script><script src="/pwa.js" defer></script></body></html>
